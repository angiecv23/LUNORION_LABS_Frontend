<div class="clients-page">
  <header class="clients-header">
    <div class="clients-header__content">
      <h1 class="headline-lg">Clientes</h1>

      <p class="body-md">Gestiona los clientes registrados en el taller.</p>
    </div>

    <button class="clients-header__button">
      <i class="pi pi-plus"></i>
      <span>Nuevo cliente</span>
    </button>
  </header>

  <section class="clients-toolbar">
    <div class="clients-search">
      <i class="pi pi-search"></i>

      <input
        type="text"
        class="input-field"
        placeholder="Buscar por nombre, documento o teléfono..."
      />
    </div>

    <div class="clients-filter">
      <i class="pi pi-filter"></i>
      <select>
        <option value="">Todos los estados</option>
        <option value="active">Activos</option>
        <option value="inactive">Inactivos</option>
      </select>
    </div>
  </section>

  <section class="clients-table-card">
    <div class="clients-table-wrapper">
      <table class="clients-table">
        <thead>
          <tr>
            <th>Cliente</th>
            <th>Documento</th>
            <th>Teléfono</th>
            <th>Email</th>
            <th>Vehículos</th>
            <th>Estado</th>
            <th class="clients-table__actions-header">Acciones</th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td colspan="7">
              <div class="clients-empty">
                <div class="clients-empty__icon">
                  <i class="pi pi-users"></i>
                </div>
                <h3>Aún no hay clientes</h3>
                <p>Los clientes registrados aparecerán aquí.</p>
                <button class="clients-empty__button">
                  <i class="pi pi-plus"></i>
                  Registrar primer cliente
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <footer class="clients-table-footer">
      <span> Mostrando 0 clientes </span>
      <div class="clients-pagination">
        <button disabled>
          <i class="pi pi-chevron-left"></i>
        </button>
        <span>1</span>
        <button disabled>
          <i class="pi pi-chevron-right"></i>
        </button>
      </div>
    </footer>
  </section>
</div>
